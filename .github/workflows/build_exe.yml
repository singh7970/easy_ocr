name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      # Fix: force UTF-8 so EasyOCR progress bar characters don't crash PowerShell
      - name: Pre-download EasyOCR models
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          echo "import easyocr" > download_models.py
          echo "import os" >> download_models.py
          echo "os.environ['PYTHONUTF8'] = '1'" >> download_models.py
          echo "print('Downloading EasyOCR models...')" >> download_models.py
          echo "r = easyocr.Reader(['en'], gpu=False, verbose=False)" >> download_models.py
          echo "print('Done.')" >> download_models.py
          echo "del r" >> download_models.py
          python -X utf8 download_models.py

      - name: Create required folders
        run: mkdir -p static\uploads
        shell: cmd

      - name: Build EXE with PyInstaller
        run: |
          $model_dir = "$env:USERPROFILE\.EasyOCR\model"
          pyinstaller `
            --onefile `
            --name "OCRApp" `
            --add-data "templates;templates" `
            --add-data "static;static" `
            --add-data "$model_dir;.EasyOCR\model" `
            --hidden-import "uvicorn.logging" `
            --hidden-import "uvicorn.loops" `
            --hidden-import "uvicorn.loops.auto" `
            --hidden-import "uvicorn.protocols" `
            --hidden-import "uvicorn.protocols.http" `
            --hidden-import "uvicorn.protocols.http.auto" `
            --hidden-import "uvicorn.protocols.websockets" `
            --hidden-import "uvicorn.protocols.websockets.auto" `
            --hidden-import "uvicorn.lifespan" `
            --hidden-import "uvicorn.lifespan.on" `
            --hidden-import "uvicorn.lifespan.off" `
            --hidden-import "fastapi" `
            --hidden-import "fastapi.templating" `
            --hidden-import "fastapi.staticfiles" `
            --hidden-import "starlette" `
            --hidden-import "starlette.routing" `
            --hidden-import "jinja2" `
            --hidden-import "sqlalchemy" `
            --hidden-import "sqlalchemy.dialects.sqlite" `
            --hidden-import "easyocr" `
            --hidden-import "cv2" `
            --hidden-import "torch" `
            --hidden-import "torchvision" `
            --hidden-import "numpy" `
            --hidden-import "fitz" `
            --hidden-import "PIL" `
            --hidden-import "python_multipart" `
            --hidden-import "multipart" `
            --hidden-import "aiofiles" `
            --hidden-import "api" `
            --hidden-import "database" `
            --hidden-import "main" `
            --hidden-import "process_document" `
            --collect-all "easyocr" `
            run_app.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: OCRApp-Windows
          path: dist/OCRApp.exe
          retention-days: 30
