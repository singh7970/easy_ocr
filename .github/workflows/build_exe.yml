name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # allows manual trigger from GitHub website

jobs:
  build-windows-exe:
    runs-on: windows-latest   # GitHub uses a real Windows machine

    steps:
      # 1. Download your code onto the Windows machine
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Python 3.11 on that Windows machine
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install all your project dependencies
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      # 4. Run app briefly so EasyOCR downloads its model weights
      #    We set a timeout because uvicorn won't exit on its own
      - name: Pre-download EasyOCR models
        run: |
          python -c "
          import easyocr
          print('Downloading EasyOCR models...')
          reader = easyocr.Reader(['en'], gpu=False, verbose=True)
          print('Models downloaded successfully.')
          del reader
          "

      # 5. Build the EXE using PyInstaller
      - name: Build EXE with PyInstaller
        run: |
          pyinstaller `
            --onefile `
            --name "OCRApp" `
            --add-data "templates;templates" `
            --add-data "static;static" `
            --add-data "$env:USERPROFILE\.EasyOCR\model;.EasyOCR\model" `
            --hidden-import "uvicorn.logging" `
            --hidden-import "uvicorn.loops" `
            --hidden-import "uvicorn.loops.auto" `
            --hidden-import "uvicorn.protocols" `
            --hidden-import "uvicorn.protocols.http" `
            --hidden-import "uvicorn.protocols.http.auto" `
            --hidden-import "uvicorn.protocols.websockets" `
            --hidden-import "uvicorn.protocols.websockets.auto" `
            --hidden-import "uvicorn.lifespan" `
            --hidden-import "uvicorn.lifespan.on" `
            --hidden-import "uvicorn.lifespan.off" `
            --hidden-import "fastapi" `
            --hidden-import "fastapi.templating" `
            --hidden-import "fastapi.staticfiles" `
            --hidden-import "starlette" `
            --hidden-import "starlette.routing" `
            --hidden-import "jinja2" `
            --hidden-import "sqlalchemy" `
            --hidden-import "sqlalchemy.dialects.sqlite" `
            --hidden-import "easyocr" `
            --hidden-import "cv2" `
            --hidden-import "torch" `
            --hidden-import "torchvision" `
            --hidden-import "numpy" `
            --hidden-import "fitz" `
            --hidden-import "PIL" `
            --hidden-import "python_multipart" `
            --hidden-import "multipart" `
            --hidden-import "aiofiles" `
            --hidden-import "api" `
            --hidden-import "database" `
            --hidden-import "main" `
            --hidden-import "process_document" `
            --collect-all "easyocr" `
            run_app.py

      # 6. Upload the finished EXE so you can download it
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: OCRApp-Windows
          path: dist/OCRApp.exe
          retention-days: 30   # file stays available for 30 days
